info:
  name: Go Custom Home
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/command/batch"
  body:
    type: json
    data: |-
      {
        "left": [0.82,-1.85,-1.25,-2.23,1.08,-2.16],
        "right": [-1.57,-0.52,-2.79,0.96,0.0,0.0]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/command/batch"
      method: POST
      body:
        type: json
        data: |-
          {
            "left": "",
            "right": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/command/batch"
      method: POST
      body:
        type: json
        data: |-
          {
            "left": "",
            "right": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
