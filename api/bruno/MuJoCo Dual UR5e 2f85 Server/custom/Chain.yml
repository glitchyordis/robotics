info:
  name: Chain
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Step 1: Run the first command
        await bru.runRequest("custom/Go Custom Home");

        // Step 2: Run the second command right after
        await bru.runRequest("custom/R go connector pos");

        bru.setVar("robot", "right"); 
        bru.setVar("positions", "[1.57, -1.57, 1.57, -1.57, 1.57, 0]");

        await bru.runRequest("Post Command");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
