info:
  name: R go connector pos
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/command"
  body:
    type: json
    data: |-
      {
        "robot": "right",
        "positions": [0.0898, -3.4070, -0.6163, -2.2417, -1.4737, -0.8073]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/command"
      method: POST
      body:
        type: json
        data: |-
          {
            "robot": "",
            "positions": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/command"
      method: POST
      body:
        type: json
        data: |-
          {
            "robot": "",
            "positions": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
